version: "3.9"

services:
  client:
    build: ./client
    container_name: chat-client
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production

  server:
    build: ./server
    container_name: chat-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production